name: Dependency Review

on:
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Validate Herta dependency manifests
        shell: bash
        run: |
          bash ./Scripts/Setup.sh --validate-only
          bash ./Scripts/Tests/DependencyLock.Tests.sh

      - name: Review dependency changes
        # Private repositories require GitHub Code Security. Herta's manifest validation above always remains active.
        if: ${{ github.event.repository.private == false || vars.HERTA_CODE_SECURITY_ENABLED == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          comment-summary-in-pr: never
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later
          fail-on-scopes: runtime, development, unknown
          fail-on-severity: moderate
