name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC Development
            runner: windows-2025-vs2026
            platform: windows
            compiler: msvc
            configuration: Development
          - name: Windows MSVC Shipping
            runner: windows-2025-vs2026
            platform: windows
            compiler: msvc
            configuration: Shipping
          - name: Linux Clang Debug-ASan
            runner: ubuntu-24.04
            platform: linux
            compiler: clang
            configuration: Debug-ASan
            cc: clang
            cxx: clang++
          - name: Linux GCC Shipping
            runner: ubuntu-24.04
            platform: linux
            compiler: gcc
            configuration: Shipping
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Restore project-local tools and SDKs
        id: bootstrap-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Setup.*', 'Scripts/DependencyLock.*') }}

      - name: Install Linux C++23 library support
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-14 g++-14 pkg-config xorg-dev libwayland-dev libwayland-bin libxkbcommon-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers weston xvfb

      - name: Set up Herta on Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: Setup.bat -VisualStudioVersion 2026

      - name: Generate Visual Studio projects
        if: matrix.platform == 'windows'
        shell: cmd
        run: GenerateProjectFiles.bat vs2026

      - name: Build Herta on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $MSBuildPath = & .\Scripts\Setup.ps1 -PrintMSBuildPath -VisualStudioVersion 2026
          if ([string]::IsNullOrWhiteSpace($MSBuildPath)) {
            throw 'Could not resolve MSBuild for Visual Studio 2026.'
          }

          & $MSBuildPath `
            Herta.slnx `
            /m `
            /t:HertaTests,HertaEditorCmd,HertaEditor `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /verbosity:minimal
          exit $LASTEXITCODE

      - name: Run tests on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $TestResults = 'TestResults/${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.configuration }}.xml'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $TestResults) | Out-Null
          & .\Binaries\windows\x86_64\${{ matrix.configuration }}\HertaTests.exe
          $ConsoleExitCode = $LASTEXITCODE
          & .\Binaries\windows\x86_64\${{ matrix.configuration }}\HertaTests.exe --reporters=junit --out=$TestResults
          if ($ConsoleExitCode -ne 0) {
            exit $ConsoleExitCode
          }
          exit $LASTEXITCODE

      - name: Run headless editor command on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $Diagnostic = & .\Binaries\windows\x86_64\${{ matrix.configuration }}\HertaEditorCmd.exe --json help | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $Diagnostic.schema -ne 1 -or $Diagnostic.status -ne 'success') {
            exit 1
          }

      - name: Set up Herta on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: bash ./Setup.sh

      - name: Generate GNU Make projects
        if: matrix.platform == 'linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: bash ./GenerateProjectFiles.sh gmake

      - name: Build Herta on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          Configuration="${{ matrix.configuration }}"
          make --directory=Intermediate/ProjectFiles/gmake \
            --jobs=2 \
            config="${Configuration,,}" \
            HertaTests \
            HertaEditorCmd \
            HertaEditor

      - name: Run tests on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set +e
          TestResults="TestResults/${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.configuration }}.xml"
          mkdir -p -- "$(dirname -- "$TestResults")"
          ./Binaries/linux/x86_64/${{ matrix.configuration }}/HertaTests
          ConsoleExitCode=$?
          ./Binaries/linux/x86_64/${{ matrix.configuration }}/HertaTests --reporters=junit --out="$TestResults"
          JunitExitCode=$?
          if [[ $ConsoleExitCode -ne 0 ]]; then
            exit "$ConsoleExitCode"
          fi
          exit "$JunitExitCode"

      - name: Run headless editor command on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          Diagnostic="$(./Binaries/linux/x86_64/${{ matrix.configuration }}/HertaEditorCmd --json help)"
          python3 -c 'import json,sys; value=json.loads(sys.argv[1]); assert value["schema"] == 1 and value["status"] == "success"' "$Diagnostic"

      - name: Run interactive editor smoke test on X11
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 2
        # Lavapipe retains process-lifetime allocations; unit tests still run with leak detection enabled.
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          LavapipeIcd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$LavapipeIcd"
          env -u WAYLAND_DISPLAY VK_DRIVER_FILES="$LavapipeIcd" \
            xvfb-run --auto-servernum ./Binaries/linux/x86_64/${{ matrix.configuration }}/HertaEditor --smoke-test --expect-window-system=x11

      - name: Run interactive editor smoke test on Wayland
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 2
        # Lavapipe retains process-lifetime allocations; unit tests still run with leak detection enabled.
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          mkdir -p TestResults
          RuntimeDirectory="$(mktemp -d)"
          chmod 700 "$RuntimeDirectory"
          XDG_RUNTIME_DIR="$RuntimeDirectory" weston --backend=headless-backend.so --socket=herta-wayland --idle-time=0 --log="$RuntimeDirectory/weston.log" &
          WestonPid=$!
          cleanup() {
            kill "$WestonPid" 2>/dev/null || true
            wait "$WestonPid" 2>/dev/null || true
            cp "$RuntimeDirectory/weston.log" "TestResults/weston-${{ matrix.compiler }}-${{ matrix.configuration }}.log" 2>/dev/null || true
            rm -rf -- "$RuntimeDirectory"
          }
          trap cleanup EXIT
          for Attempt in {1..50}; do
            if [[ -S "$RuntimeDirectory/herta-wayland" ]]; then
              break
            fi
            sleep 0.1
          done
          test -S "$RuntimeDirectory/herta-wayland"
          LavapipeIcd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$LavapipeIcd"
          env -u DISPLAY XDG_RUNTIME_DIR="$RuntimeDirectory" WAYLAND_DISPLAY=herta-wayland \
            VK_DRIVER_FILES="$LavapipeIcd" ./Binaries/linux/x86_64/${{ matrix.configuration }}/HertaEditor --smoke-test --expect-window-system=wayland

      - name: Save project-local tools and SDKs
        if: github.event_name != 'pull_request' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Setup.*', 'Scripts/DependencyLock.*') }}

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.configuration }}-${{ github.sha }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: required
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
