name: Quality

on:
  pull_request:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schedule-guard:
    name: Scheduled change guard
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check for commits since the previous scheduled run
        id: check
        shell: bash
        env:
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ApiUrl="https://api.github.com/repos/${REPOSITORY}/actions/workflows/quality.yml/runs?event=schedule&status=completed&branch=${DEFAULT_BRANCH}&per_page=1"
          if ! Response="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$ApiUrl")"; then
            echo "::warning::Could not query the previous scheduled Quality run; running validation."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PreviousSha="$(python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")' <<< "$Response")"
          if [[ -n "$PreviousSha" && "$PreviousSha" == "$CURRENT_SHA" ]]; then
            echo "No commits since the previous scheduled Quality run."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled Quality will validate ${CURRENT_SHA}."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  bootstrap-windows:
    name: Bootstrap tests - Windows
    needs:
      - schedule-guard
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Test bootstrap scripts
        shell: pwsh
        run: |
          ./Scripts/Windows/Tests/DependencyLock.Tests.ps1
          ./Setup.bat -ValidateOnly
          ./Cleanup.bat -WhatIf

  bootstrap-linux:
    name: Bootstrap tests - Linux
    needs:
      - schedule-guard
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Test bootstrap scripts
        shell: bash
        run: |
          ./Scripts/Linux/Tests/DependencyLock.Tests.sh
          ./Setup.sh --validate-only
          ./Cleanup.sh --dry-run

  formatting:
    name: Formatting and repository hygiene
    needs:
      - schedule-guard
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check ignored files are not tracked
        shell: bash
        run: test -z "$(git ls-files --cached --ignored --exclude-standard)"

      - name: Check workflow action pins
        shell: bash
        run: |
          Failed=0
          while IFS= read -r Usage; do
            if [[ "$Usage" == ./* ]]; then
              continue
            fi

            Revision="${Usage##*@}"
            if [[ ! "$Revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Action is not pinned to a full commit SHA: $Usage"
              Failed=1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 -r sed -nE 's/^[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/p')
          exit "$Failed"

      - name: Check C and C++ formatting
        shell: bash
        run: |
          clang-format-18 --version
          git ls-files -z -- \
            ':(glob)Engine/**/*.c' \
            ':(glob)Engine/**/*.cc' \
            ':(glob)Engine/**/*.cpp' \
            ':(glob)Engine/**/*.h' \
            ':(glob)Engine/**/*.hpp' \
            ':(glob)Games/**/*.c' \
            ':(glob)Games/**/*.cc' \
            ':(glob)Games/**/*.cpp' \
            ':(glob)Games/**/*.h' \
            ':(glob)Games/**/*.hpp' \
            | xargs -0 -r clang-format-18 -i
          git diff --exit-code

  clang-tidy:
    name: Clang-Tidy
    needs:
      - schedule-guard
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Restore project-local tools and SDKs
        id: bootstrap-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/**/Setup.*', 'Scripts/**/DependencyLock.*') }}

      - name: Install compilation database capture
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bear clang-19 clang-tidy-19 gcc-14 g++-14 pkg-config xorg-dev libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Set up Herta
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
        run: bash ./Setup.sh

      - name: Generate GNU Make projects
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
        run: bash ./GenerateProjectFiles.sh gmake

      - name: Analyze Herta sources
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          clang-tidy-19 --version
          bear --output compile_commands.json -- \
            make --directory=Intermediate/ProjectFiles/gmake \
              --jobs=2 \
              config=development \
              HertaTests \
              HertaEditorCmd \
              HertaEditor
          test -s compile_commands.json
          mapfile -d '' Sources < <(git ls-files -z -- \
            ':(glob)Engine/**/*.cpp' \
            ':(glob)Games/**/*.cpp')
          test "${#Sources[@]}" -gt 0
          clang-tidy-19 \
            --config-file=.clang-tidy \
            -p=. \
            "${Sources[@]}"

      - name: Save project-local tools and SDKs
        if: github.event_name != 'pull_request' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/**/Setup.*', 'Scripts/**/DependencyLock.*') }}

  required:
    name: required
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    needs:
      - schedule-guard
      - bootstrap-windows
      - bootstrap-linux
      - formatting
      - clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality check
        shell: bash
        env:
          BOOTSTRAP_WINDOWS_RESULT: ${{ needs.bootstrap-windows.result }}
          BOOTSTRAP_LINUX_RESULT: ${{ needs.bootstrap-linux.result }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          CLANG_TIDY_RESULT: ${{ needs.clang-tidy.result }}
        run: |
          test "$BOOTSTRAP_WINDOWS_RESULT" = success
          test "$BOOTSTRAP_LINUX_RESULT" = success
          test "$FORMATTING_RESULT" = success
          test "$CLANG_TIDY_RESULT" = success
