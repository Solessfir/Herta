name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze C and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Restore project-local tools and SDKs
        id: bootstrap-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Setup.*', 'Scripts/DependencyLock.*') }}

      - name: Install Linux C++23 library support
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-14 g++-14 pkg-config xorg-dev libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Set up Herta
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: bash ./Setup.sh

      - name: Generate GNU Make projects
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: bash ./GenerateProjectFiles.sh gmake

      - name: Build Herta
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          make
          --directory=Intermediate/ProjectFiles/gmake
          --jobs=2
          config=development
          HertaTests
          HertaEditorCmd
          HertaEditor

      - name: Analyze Herta
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:c-cpp

      - name: Save project-local tools and SDKs
        if: github.event_name != 'pull_request' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Setup.*', 'Scripts/DependencyLock.*') }}
