name: CodeQL

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C and C++
    # Private repositories require GitHub Code Security. The variable keeps the workflow ready for a licensed private repository.
    if: ${{ github.event.repository.private == false || vars.HERTA_CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out Herta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Restore project-local tools and SDKs
        id: bootstrap-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/**/Setup.*', 'Scripts/**/DependencyLock.*') }}

      - name: Install Linux C++23 library support
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-14 g++-14 pkg-config xorg-dev libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: c-cpp
          build-mode: manual

      - name: Set up Herta
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: bash ./Setup.sh

      - name: Generate GNU Make projects
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: bash ./GenerateProjectFiles.sh gmake

      - name: Build Herta
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          make
          --directory=Intermediate/ProjectFiles/gmake
          --jobs=2
          config=development
          HertaTests
          HertaEditorCmd
          HertaEditor

      - name: Analyze Herta
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:c-cpp
          upload: never
          output: codeql-results

      # Extraction follows the compiler, so paths-ignore cannot exclude compiled third-party code. Its findings belong upstream; pinned revisions are updated instead of patched.
      - name: Drop third-party results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          def is_third_party(result):
              locations = result.get("locations", [])
              return bool(locations) and all(location["physicalLocation"]["artifactLocation"]["uri"].startswith("External/") for location in locations)

          for path in pathlib.Path("codeql-results").glob("*.sarif"):
              sarif = json.loads(path.read_text(encoding="utf-8"))
              for run in sarif["runs"]:
                  results = run.get("results", [])
                  run["results"] = [result for result in results if not is_third_party(result)]
                  print(f"{path.name}: kept {len(run['results'])} of {len(results)} results")
              path.write_text(json.dumps(sarif), encoding="utf-8")
          PY

      - name: Upload Herta results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: codeql-results
          category: /language:c-cpp

      - name: Save project-local tools and SDKs
        if: github.event_name != 'pull_request' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            External/Premake
            SDK
          key: ${{ runner.os }}-herta-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/**/Setup.*', 'Scripts/**/DependencyLock.*') }}
